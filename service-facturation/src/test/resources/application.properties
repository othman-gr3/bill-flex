# Test configuration: tests must not depend on the Config Server or on Eureka
spring.application.name=service-facturation
spring.cloud.config.enabled=false
eureka.client.enabled=false

spring.datasource.url=jdbc:h2:mem:facturationdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data.sql

resilience4j.retry.retry-aspect-order=3
resilience4j.circuitbreaker.circuit-breaker-aspect-order=2
resilience4j.retry.instances.service-clients.max-attempts=3
resilience4j.retry.instances.service-clients.wait-duration=1ms
resilience4j.retry.instances.service-clients.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable
resilience4j.retry.instances.service-abonnements.max-attempts=3
resilience4j.retry.instances.service-abonnements.wait-duration=1ms
resilience4j.retry.instances.service-abonnements.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable
