# Served to the Gateway when it runs with the active profile "statique"
# (overrides gateway-service.properties: no discovery locator, explicit routes)
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=service-clients
spring.cloud.gateway.server.webflux.routes[0].uri=lb://service-clients
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/clients/**,/payments/**

spring.cloud.gateway.server.webflux.routes[1].id=service-abonnements
spring.cloud.gateway.server.webflux.routes[1].uri=lb://service-abonnements
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/plans/**,/subscriptions/**

spring.cloud.gateway.server.webflux.routes[2].id=service-facturation
spring.cloud.gateway.server.webflux.routes[2].uri=lb://service-facturation
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/invoices/**
