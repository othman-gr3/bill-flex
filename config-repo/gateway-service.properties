server.port=8080

# Dynamic routing: /<service-name>/** for every service registered in Eureka
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.server.webflux.discovery.locator.include-expression=serviceId.toLowerCase() matches 'service-abonnements|service-facturation|service-clients'
