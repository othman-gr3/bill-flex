server.port=8082

spring.datasource.url=jdbc:h2:mem:facturationdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data.sql

# ===== Resilience4j =====

# OpenFeign: timeouts per call, in milliseconds
spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=2000

# Aspect order: Retry wraps CircuitBreaker, which wraps Bulkhead
resilience4j.retry.retry-aspect-order=1
resilience4j.circuitbreaker.circuit-breaker-aspect-order=2
resilience4j.bulkhead.bulkhead-aspect-order=3

# Retry: 3 attempts in total on transient errors
resilience4j.retry.instances.service-clients.max-attempts=3
resilience4j.retry.instances.service-clients.wait-duration=500ms
resilience4j.retry.instances.service-clients.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

resilience4j.retry.instances.service-abonnements.max-attempts=3
resilience4j.retry.instances.service-abonnements.wait-duration=500ms
resilience4j.retry.instances.service-abonnements.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

# Circuit breaker: Feign 4xx errors are ignored in the failure rate
resilience4j.circuitbreaker.instances.service-clients.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.service-clients.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.service-clients.sliding-window-size=6
resilience4j.circuitbreaker.instances.service-clients.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.service-clients.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.service-clients.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.service-clients.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.service-clients.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.service-abonnements.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.service-abonnements.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.service-abonnements.sliding-window-size=6
resilience4j.circuitbreaker.instances.service-abonnements.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.service-abonnements.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.service-abonnements.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.service-abonnements.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.service-abonnements.automatic-transition-from-open-to-half-open-enabled=true

# Bulkhead: 10 simultaneous calls per service, no waiting
resilience4j.bulkhead.instances.service-clients.max-concurrent-calls=10
resilience4j.bulkhead.instances.service-clients.max-wait-duration=0ms
resilience4j.bulkhead.instances.service-abonnements.max-concurrent-calls=10
resilience4j.bulkhead.instances.service-abonnements.max-wait-duration=0ms

# Rate limiter: 5 detailed consultations per 1-second period
resilience4j.ratelimiter.instances.consultation.limit-for-period=5
resilience4j.ratelimiter.instances.consultation.limit-refresh-period=1s
resilience4j.ratelimiter.instances.consultation.timeout-duration=0ms